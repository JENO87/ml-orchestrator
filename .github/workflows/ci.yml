name: CI/CD Pipeline

on:
  push:
    branches: [development]  # Add development for lightweight runs
  pull_request:
    branches: [quality, main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (development, quality, main)'
        required: true
        type: choice
        options: [development, quality, main]
        default: development

  #push:
  #  branches: [main, development]
  #  tags: ['v*']  # Triggers on tags like v1.0.0
  #pull_request:
  #  branches: [main, development]

# In build-docker, tag-docker, push-docker, clean-after-push jobs
env:
   DOCKER_PREFIX: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch == 'development' && 'dev-' || github.ref_name == 'quality' && 'qa-' || github.ref_name == 'main' && '' }}

# Define reusable steps with YAML anchors
defaults:
  run:
    shell: bash

jobs:
  install-dependencies:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@v4
      - &install-uv
        name: Install UV
        run: make install-uv
      - &sync-deps
        name: Sync dependencies
        run: make sync
      - &editable-install
        name: Editable install
        run: make editable-install

  run-linters:
    name: Run Linters
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - &run-pre-commit
        name: Run pre-commit
        run: make pre-commit
      - &run-linters
        name: Run linters
        run: make lint

  check-formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - name: Check formatting
        run: make format-check

  run-type-checking:
    name: Run Type Checking
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - name: Run type checking
        run: make type-check

  run-unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - name: Run unit tests
        run: make test

  generate-coverage-report:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - name: Generate coverage report
        run: make test
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            coverage.xml
            report.xml

  build-package:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [ install-dependencies, run-linters, check-formatting, run-type-checking, run-unit-tests ]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'quality' || github.ref_name == 'main'))
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - *editable-install
      - name: Extract version
        id: get-version
        run: echo "VERSION=$(python -c 'from dev_template import __version__; print(__version__)')" >> $GITHUB_ENV
      - name: Build package
        run: make build-package
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*

  export-requirements:
    name: Export Requirements
    runs-on: ubuntu-latest
    needs: [build-package]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'quality' || github.ref_name == 'main'))
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - name: Export requirements
        run: make export
      - name: Upload requirements
        uses: actions/upload-artifact@v4
        with:
          name: requirements
          path: requirements.txt

  publish-package:
    name: Publish Package
    runs-on: ubuntu-latest
    needs: [ build-package ]
    if: github.event_name == 'push' && (github.ref_name == 'quality' || github.ref_name == 'main')
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: package
          path: dist/
      - name: Publish to GitHub Packages
        run: make publish-package
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [ build-package, export-requirements ]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'quality' || github.ref_name == 'main'))
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - name: Download requirements
        uses: actions/download-artifact@v4
        with:
          name: requirements
          path: .
      - name: Build Docker image
        run: make build-docker-image
        env:
          DOCKER_TAG: ${{ env.DOCKER_PREFIX }}${{ env.VERSION }}

  tag-docker-image:
    name: Tag Docker Image
    runs-on: ubuntu-latest
    needs: [ build-docker-image ]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'quality' || github.ref_name == 'main'))
    steps:
      - *checkout
      - name: Tag Docker image
        run: make tag-docker-image
        env:
          DOCKER_TAG: ${{ env.DOCKER_PREFIX }}${{ env.VERSION }}

  push-docker-image:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: [ tag-docker-image ]
    if: github.event_name == 'push' && (github.ref_name == 'quality' || github.ref_name == 'main')
    steps:
      - *checkout
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Docker image
        run: make push-docker-image
        env:
          DOCKER_TAG: ${{ env.DOCKER_PREFIX }}${{ env.VERSION }}

  clean-after-push:
    name: Clean Docker Images
    runs-on: ubuntu-latest
    needs: [ push-docker-image ]
    if: github.event_name == 'push' && (github.ref_name == 'quality' || github.ref_name == 'main')
    steps:
      - *checkout
      - name: Clean Docker images
        run: make clean-docker-image
        env:
          DOCKER_TAG: ${{ env.DOCKER_PREFIX }}${{ env.VERSION }}
