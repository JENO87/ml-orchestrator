name: CI Pipeline


on:
  push:
    branches: [ "main", "development", "quality" ]
  pull_request:
    branches: [ "main", "development", "quality" ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'development'

# Define reusable steps with YAML anchors
defaults:
  run:
    shell: bash

jobs:
  install-dependencies:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@v4
      - &install-uv
        name: Install UV
        run: make install-uv
      - &sync-deps
        name: Sync dependencies
        run: make sync
      - &editable-install
        name: Editable install
        run: make editable-install

  run-linters:
    name: Run Linters
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - name: Run lint checks
        run: make lint-check

  check-formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - name: Check formatting
        run: make format-check

  run-type-checking:
    name: Run Type Checking
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - name: Run type checking
        run: make type-check

  run-unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - name: Run unit tests
        run: make test

  generate-coverage-report:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - name: Generate coverage report
        run: make test
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            coverage.xml
            report.xml

  build-package:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [ install-dependencies, run-linters, check-formatting, run-type-checking, run-unit-tests ]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'quality' || github.ref_name == 'main'))
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - *editable-install
      - name: Extract version
        id: get-version
        run: echo "VERSION=$(python -c 'from ml_orchestrator import __version__; print(__version__)')" >> $GITHUB_ENV
      - name: Build package
        run: make build-package
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*

  export-requirements:
    name: Export Requirements
    runs-on: ubuntu-latest
    needs: [build-package]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'quality' || github.ref_name == 'main'))
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - name: Export requirements
        run: make export
      - name: Upload requirements
        uses: actions/upload-artifact@v4
        with:
          name: requirements
          path: requirements.txt

  publish-package:
    name: Publish Package
    runs-on: ubuntu-latest
    needs: [ build-package ]
    if: github.event_name == 'push' && (github.ref_name == 'quality' || github.ref_name == 'main')
    steps:
      - *checkout
      - *install-uv
      - *sync-deps
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: package
          path: dist/
      - name: Publish to GitHub Packages
        run: make publish-package
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
