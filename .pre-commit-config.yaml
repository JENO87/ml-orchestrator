# .pre-commit-config.yaml
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.1  # Use the latest version of ruff
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: uv run pylint
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        args: ["--package", "ml_orchestrator", "--untyped-calls-exclude=google.oauth2.service_account", "--untyped-calls-exclude=google.auth", "--untyped-calls-exclude=google.cloud.aiplatform"]
        pass_filenames: false
      - id: show-diff-on-modify
        name: Show Diff on Modified Files
        entry: cmd /c "git diff --exit-code || (echo \"Changes detected by pre-commit hooks. Review the diff above.\" && exit 1)"
        language: system
        always_run: true
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^\.mypy_cache/
      - id: end-of-file-fixer
        exclude: ^\.mypy_cache/
      - id: check-yaml
      - id: check-added-large-files
        exclude: ^\.mypy_cache/
